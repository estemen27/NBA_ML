version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: nba_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nba_user
      POSTGRES_PASSWORD: nba_pass
      POSTGRES_DB: nba_database
    ports:
      - "5433:5432"
    volumes:
      - nba_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nba_user -d nba_database"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: nba_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@nba.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      - postgres

volumes:
  nba_postgres_data: